<header style="max-width: 1160px; margin: 0 auto; padding: 28px clamp(20px, 5vw, 48px); display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
    {% include 'components/logo.html' %}
    <nav class="desktop-nav" style="display: flex; gap: 42px; margin-left: auto; font-size: 18px; white-space: nowrap">
        <a href="{% url 'courses:course_list' %}" style="color: #d9cfc2; transition: color 0.2s, border-color 0.2s; border-bottom: 2px solid transparent; padding-bottom: 4px" class="h-nav">Kursy</a>
        <a href="{% url 'blog:blog_list' %}" style="color: #d9cfc2; transition: color 0.2s, border-color 0.2s; border-bottom: 2px solid transparent; padding-bottom: 4px" class="h-nav">Blog</a>

    <button id="menu-open-btn" aria-label="Otwórz menu" class="mobile-menu-btn" style="display: none; margin-left: auto; width: 44px; height: 44px; border-radius: 4px; border: 1px solid #3a3025; background: transparent; color: #facb8d; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.2s">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 7h16"></path>

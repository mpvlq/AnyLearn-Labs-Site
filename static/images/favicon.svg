<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="8" ry="8" fill="#ffe3bf"/>
  <g transform="translate(32, 32) scale(0.7)">
    <!-- Central large circle -->
    <circle cx="0" cy="0" r="8" fill="#d4a257"/>

    <!-- Top branch -->
    <line x1="0" y1="-8" x2="0" y2="-22" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-24" r="4.5" fill="#b8873d"/>

    <!-- Top-right branch -->
    <line x1="5.6" y1="-5.6" x2="16" y2="-16" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="-18" r="4.5" fill="#b8873d"/>

    <!-- Right branch with elbow -->
    <line x1="8" y1="0" x2="14" y2="0" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="14" y2="-8" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="14" cy="-10" r="4.5" fill="#b8873d"/>

    <!-- Bottom-right branch -->
    <line x1="5.6" y1="5.6" x2="11" y2="11" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="12.5" cy="12.5" r="4.5" fill="#b8873d"/>

    <!-- Bottom branch -->
    <line x1="0" y1="8" x2="0" y2="20" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="4.5" fill="#b8873d"/>

    <!-- Left branch -->
    <line x1="-8" y1="0" x2="-18" y2="0" stroke="#b8873d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-20" cy="0" r="4.5" fill="#b8873d"/>
  </g>
</svg>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/classical-4dd99f8a-1b0a-4034-9c9d-97d52fa52633/styles.css">
  <script src="_ds/classical-4dd99f8a-1b0a-4034-9c9d-97d52fa52633/_ds_bundle.js"></script>
  <style>body{margin:0}a{color:#facb8d}a:hover{color:#c28d41}</style>
</helmet>
<sc-if value="{{ embedded }}" hint-placeholder-val="{{ false }}">
  <div style="position: relative; width: 100%; height: 100%; cursor: grab" ref="{{ hostRef }}"></div>
</sc-if>
<sc-if value="{{ standalone }}" hint-placeholder-val="{{ true }}">
  <div style="position: fixed; inset: 0; cursor: grab" ref="{{ hostRef }}"></div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;firingRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0.2,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;rotationSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:4,&quot;step&quot;:0.1,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;embedded&quot;:{&quot;editor&quot;:null,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  hostRef = React.createRef();
  componentDidMount() {
    const host = this.hostRef.current;
    const cv = document.createElement('canvas');
    cv.style.cssText = 'width:100%;height:100%;display:block';
    host.appendChild(cv);
    const ctx = cv.getContext('2d');
    this.cv = cv;
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const dir = () => { const x = gauss(), y = gauss(), z = gauss(), l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };
    const P = [];
    // cerebral hemispheres
    for (let i = 0; i < 380; i++) {
      const s = i % 2 ? 1 : -1;
      let [dx, dy, dz] = dir();
      if (dx * s < -0.35 && rnd() > 0.15) { i--; continue; }
      const g = 1 + 0.05 * Math.sin(dz * 11 + dy * 5) * Math.sin(dy * 9 - dx * 4);
      let x = s * 0.33 + dx * 0.4 * g, y = dy * 0.58 * g, z = dz * 0.95 * g;
      if (y < -0.22) y = -0.22 + (y + 0.22) * 0.45;
      x *= 1 - 0.12 * z;
      if (y < 0 && Math.abs(z) < 0.5) x *= 1.06;
      P.push([x, y + 0.08, z]);
    }
    // cerebellum
    for (let i = 0; i < 55; i++) {
      const [dx, dy, dz] = dir();
      if (dy > 0.6) { i--; continue; }
      P.push([dx * 0.4, -0.36 + dy * 0.17, -0.62 + dz * 0.24]);
    }
    // stem
    for (let i = 0; i < 9; i++) { const t = i / 8; P.push([(rnd() - 0.5) * 0.06, -0.3 - t * 0.5, -0.22 - t * 0.12]); }
    const N = P.length, E = [], adj = P.map(() => []), seen = new Set();
    for (let i = 0; i < N; i++) {
      const d = [];
      for (let j = 0; j < N; j++) if (j !== i) d.push([Math.hypot(P[i][0] - P[j][0], P[i][1] - P[j][1], P[i][2] - P[j][2]), j]);
      d.sort((a, b) => a[0] - b[0]);
      for (let k = 0; k < 3; k++) {
        const [dist, j] = d[k]; if (dist > 0.32) break;
        const key = i < j ? i + '_' + j : j + '_' + i;
        if (seen.has(key)) continue; seen.add(key);
        E.push([i, j]); adj[i].push([j, dist]); adj[j].push([i, dist]);
      }
    }
    const glow = new Float32Array(N), pulses = [];
    let rotY = 0.6, rotX = -0.22, drag = null, nextFire = 0, last = performance.now();
    const fire = (i, now, depth) => {
      glow[i] = 1;
      if (depth > 7) return;
      for (const [j, dist] of adj[i]) if (Math.random() < 0.55) pulses.push({ a: i, b: j, t0: now, dur: dist * 1400, depth });
    };
    const resize = () => { const r = host.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; };
    resize();
    this.ro = new ResizeObserver(resize); this.ro.observe(host);
    host.onpointerdown = e => { drag = [e.clientX, e.clientY, rotY, rotX]; host.style.cursor = 'grabbing'; host.setPointerCapture(e.pointerId); };
    host.onpointermove = e => { if (!drag) return; rotY = drag[2] + (e.clientX - drag[0]) * 0.008; rotX = Math.max(-1.2, Math.min(1.2, drag[3] + (e.clientY - drag[1]) * 0.008)); };
    host.onpointerup = () => { drag = null; host.style.cursor = 'grab'; };
    const S = new Float32Array(N * 3);
    const loop = now => {
      const dt = Math.min(64, now - last); last = now;
      const p = this.props, light = p.theme === 'light';
      const C = light ? { bg: '#f3f2f2', ink: '32,31,29', gold: '182,130,53', hot: '182,130,53' } : { bg: '#14110d', ink: '217,207,194', gold: '194,141,65', hot: '250,203,141' };
      if (!drag) rotY += dt * 0.00012 * (p.rotationSpeed ?? 1);
      if (now > nextFire) { fire(Math.floor(Math.random() * N), now, 0); nextFire = now + (500 + Math.random() * 1400) / (p.firingRate ?? 1); }
      const W = cv.width, H = cv.height, sc = Math.min(W, H) * 0.42, cx = W / 2, cy = H / 2;
      const cy1 = Math.cos(rotY), sy1 = Math.sin(rotY), cx1 = Math.cos(rotX), sx1 = Math.sin(rotX);
      for (let i = 0; i < N; i++) {
        const [x, y, z] = P[i];
        const x1 = x * cy1 + z * sy1, z1 = -x * sy1 + z * cy1;
        const y2 = y * cx1 - z1 * sx1, z2 = y * sx1 + z1 * cx1;
        const f = 3 / (3 + z2);
        S[i * 3] = cx + x1 * sc * f; S[i * 3 + 1] = cy - y2 * sc * f; S[i * 3 + 2] = z2;
      }
      const depthA = z => 0.35 + 0.65 * (1 - (z + 1) / 2);
      if (p.embedded) ctx.clearRect(0, 0, W, H); else { ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); }
      const dpr = window.devicePixelRatio || 1;
      ctx.lineWidth = 0.8 * dpr;
      for (const [a, b] of E) {
        ctx.strokeStyle = `rgba(${C.ink},${(light ? 0.16 : 0.13) * depthA((S[a * 3 + 2] + S[b * 3 + 2]) / 2)})`;
        ctx.beginPath(); ctx.moveTo(S[a * 3], S[a * 3 + 1]); ctx.lineTo(S[b * 3], S[b * 3 + 1]); ctx.stroke();
      }
      ctx.lineWidth = 1.4 * dpr;
      for (let k = pulses.length - 1; k >= 0; k--) {
        const q = pulses[k], t = (now - q.t0) / q.dur;
        if (t >= 1) { pulses.splice(k, 1); fire(q.b, now, q.depth + 1); continue; }
        const ax = S[q.a * 3], ay = S[q.a * 3 + 1], bx = S[q.b * 3], by = S[q.b * 3 + 1];
        const t0 = Math.max(0, t - 0.35);
        const g = ctx.createLinearGradient(ax, ay, bx, by);
        g.addColorStop(t0, `rgba(${C.gold},0)`); g.addColorStop(t, `rgba(${C.hot},0.95)`); g.addColorStop(Math.min(1, t + 0.001), `rgba(${C.gold},0)`);
        ctx.strokeStyle = g;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
      for (let i = 0; i < N; i++) {
        const x = S[i * 3], y = S[i * 3 + 1], a = depthA(S[i * 3 + 2]), r = (1 + a * 1.3) * dpr;
        if (glow[i] > 0.01) {
          ctx.fillStyle = `rgba(${C.gold},${glow[i] * 0.22})`;
          ctx.beginPath(); ctx.arc(x, y, r * 5 * glow[i] + r, 0, 6.283); ctx.fill();
          ctx.fillStyle = `rgba(${C.hot},${0.4 + glow[i] * 0.6})`;
          ctx.beginPath(); ctx.arc(x, y, r * 1.3, 0, 6.283); ctx.fill();
          glow[i] *= Math.pow(0.996, dt);
        } else {
          ctx.fillStyle = `rgba(${C.ink},${a * (light ? 0.75 : 0.6)})`;
          ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
        }
      }
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.ro && this.ro.disconnect(); this.cv && this.cv.remove(); }
  renderVals() { const e = !!this.props.embedded; return { hostRef: this.hostRef, embedded: e, standalone: !e }; }
}
</script>
</body>
</html>
